services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_radio_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      DB_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/smart_radio_monitor
      SECRET_KEY: ${SECRET_KEY}
      FLASK_DEBUG: "0"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - whisper_cache:/root/.cache/whisper
      - media:/app/media

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    depends_on:
      - app

  db-backup:
    image: prodrigestivill/postgres-backup-local:15
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: smart_radio_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups/postgres:/backups
    depends_on:
      db:
        condition: service_healthy

  volume-backup:
    image: offen/docker-volume-backup:v2
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: "0 3 * * *"
      BACKUP_FILENAME: "media-backup-%Y-%m-%dT%H-%M-%S.tar.gz"
      BACKUP_RETENTION_DAYS: 14
    volumes:
      - media:/backup/media:ro
      - npm_data:/backup/npm_data:ro
      - npm_letsencrypt:/backup/npm_letsencrypt:ro
      - ./backups/volumes:/archive

volumes:
  postgres_data:
  whisper_cache:
  npm_data:
  npm_letsencrypt:
  media:
